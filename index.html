<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>AI Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <h1>AI<span>.</span>Chat</h1>
    <button class="key-toggle" id="keyToggle">API Key</button>
  </header>

  <div class="key-panel" id="keyPanel">
    <label for="apiKey">Groq API Key</label>
    <input type="password" id="apiKey" placeholder="gsk_...">
    <small>Key sirf is browser mein save hoti hai. Free key <a href="https://console.groq.com/keys" target="_blank" style="color:var(--violet)">yahan se</a> milegi.</small>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="msg bot">Hi! Main aapka AI assistant hoon. Pehle upar "API Key" button dabakar apni Groq key daal dein, phir mujhse kuch bhi pooch sakte hain.</div>
  </div>

  <form id="chatForm">
    <button type="button" class="icon-btn attach-btn" id="attachBtn" title="Add">+</button>
    <input type="text" id="userInput" placeholder="Apna message likhein..." autocomplete="off">
    <button type="submit" id="sendBtn">➤</button>
</form>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span></span>
      <h3>Add to chat</h3>
      <button type="button" id="sheetClose">✕</button>
    </div>
    <div class="sheet-options">
      <button type="button" class="sheet-option" id="cameraOption">
        <div class="sheet-icon">📷</div>
        <span>Camera</span>
      </button>
      <button type="button" class="sheet-option" id="galleryOption">
        <div class="sheet-icon">🖼️</div>
        <span>Photos</span>
      </button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="galleryInput" accept="image/*" hidden>
  </div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
